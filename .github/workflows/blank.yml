# This is a basic workflow to help you get started with Actions

name: CI

# Controls when the workflow will run
on:
  # Triggers the workflow on push or pull request events but only for the "main" branch
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

# A workflow run is made up of one or more jobs that can run sequentially or in parallel
jobs:
  # This workflow contains a single job called "build"
  build:
    # The type of runner that the job will run on
    runs-on: ubuntu-latest

    # Steps represent a sequence of tasks that will be executed as part of the job
    steps:
      # Checks-out your repository under $GITHUB_WORKSPACE, so your job can access it
      - uses: actions/checkout@v4

      - name: Install OC CLI
        run: |
          curl -L https://mirror.openshift.com/pub/openshift-v4/clients/ocp/latest/openshift-client-linux.tar.gz | tar xz
          sudo mv oc /usr/local/bin/
          oc version
      
      - name: Verificar secreto OPENSHIFT_TOKEN sin exponerlo
        env:
          OPENSHIFT_TOKEN: ${{ secrets.OPENSHIFT_TOKEN }}
        run: |
          if [ -z "$OPENSHIFT_TOKEN" ]; then
            echo "ERROR: OPENSHIFT_TOKEN no está definido o está vacío."
            exit 1
          fi
          echo "::add-mask::$OPENSHIFT_TOKEN"  # asegura que se oculte si se imprime por error
          echo "Longitud del token: ${#OPENSHIFT_TOKEN} caracteres"
          echo -n "$OPENSHIFT_TOKEN" | sha256sum | awk '{print "sha256(token) = "$1}'
      
      - name: Saneando token (quitar CR/LF) y exportando a entorno
        env:
          RAW_TOKEN: ${{ secrets.OPENSHIFT_TOKEN }}
        run: |
          CLEAN_TOKEN="$(printf '%s' "$RAW_TOKEN" | tr -d '\r\n')"
          echo "OPENSHIFT_TOKEN_STRIPPED=$CLEAN_TOKEN" >> $GITHUB_ENV
          echo "::add-mask::$CLEAN_TOKEN"
          echo "Longitud saneada: ${#CLEAN_TOKEN}"

      - name: Validar JWT (formato, exp, aud, sub) sin exponerlo
        run: |
          set -euo pipefail
          python3 - "$OPENSHIFT_TOKEN_STRIPPED" <<- 'PY'
            import sys, json, base64, time
            tok = sys.argv[1]

            parts = tok.split('.')
            if len(parts) != 3:
                print("ERROR: el token no tiene formato JWT (header.payload.signature)")
                sys.exit(1)
            h, p, s = parts

            def b64url_decode(x: str) -> str:
                x += "=" * (-len(x) % 4)
                return base64.urlsafe_b64decode(x.encode()).decode("utf-8", "ignore")

            try:
                header  = json.loads(b64url_decode(h))
                payload = json.loads(b64url_decode(p))
            except Exception as e:
                print("ERROR: no se pudo decodificar header/payload:", e)
                sys.exit(1)

            print("JWT header:", json.dumps(header, ensure_ascii=False, indent=2))
            print("JWT payload:", json.dumps(payload, ensure_ascii=False, indent=2))

            now = int(time.time())
            exp = payload.get("exp")
            if exp is not None:
                left = exp - now
                print(f"exp: {exp} (restan {left} s)")
                if left <= 0:
                    print("ERROR: token EXPIRADO")
                    sys.exit(2)
            else:
                print("ADVERTENCIA: payload sin 'exp'")

            aud = payload.get("aud")
            ok_aud = False
            if isinstance(aud, list):
                ok_aud = ("openshift" in aud) or ("https://kubernetes.default.svc" in aud)
            else:
                ok_aud = aud in ("openshift", "https://kubernetes.default.svc")
            print("aud válida?:", ok_aud, "| aud:", aud)

            expected_ns = "forcet22-dev"
            expected_sa = "cicd-forcet"
            sub = payload.get("sub")
            if sub != f"system:serviceaccount:{expected_ns}:{expected_sa}":
                print("ADVERTENCIA: sub no coincide con SA/NS esperado:", sub)

            # 6) Resultado “a priori”
            if (exp is None or exp > now) and ok_aud:
                print("JWT válido a priori (no expirado y con audiencia aceptable).")
          PY

      - name: Probar oc login directo (debug)
        run: |
          oc version
          oc login --token="$OPENSHIFT_TOKEN_STRIPPED" --server="https://api.rm1.0a51.p1.openshiftapps.com:6443"
          oc whoami
          oc whoami --show-user
          
      - name: Log in Openshift
        uses: redhat-actions/oc-login@v1
        with:
          openshift_server_url: https://api.rm1.0a51.p1.openshiftapps.com:6443
          openshift_token: ${{ env.OPENSHIFT_TOKEN_STRIPPED }} 
          namespace: forcet22-dev

      - name: Deploy files
        run: |
          oc project forcet22-dev
          oc apply -f config/security/serviceAccount.yml
          oc rollout status deployment/forcet-deployment

      - name: End
        run: | 
          echo "Si llego aquí es que finalizo, cierto!!"
