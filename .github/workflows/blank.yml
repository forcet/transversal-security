# This is a basic workflow to help you get started with Actions

name: CI

# Controls when the workflow will run
on:
  # Triggers the workflow on push or pull request events but only for the "main" branch
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

# A workflow run is made up of one or more jobs that can run sequentially or in parallel
jobs:
  # This workflow contains a single job called "build"
  build:
    # The type of runner that the job will run on
    runs-on: ubuntu-latest

    # Steps represent a sequence of tasks that will be executed as part of the job
    steps:
      # Checks-out your repository under $GITHUB_WORKSPACE, so your job can access it
      - uses: actions/checkout@v4

      - name: Install OC CLI
        run: |
          curl -L https://mirror.openshift.com/pub/openshift-v4/clients/ocp/latest/openshift-client-linux.tar.gz | tar xz
          sudo mv oc /usr/local/bin/
          oc version
      
      - name: Verificar secreto OPENSHIFT_TOKEN sin exponerlo
        env:
          OPENSHIFT_TOKEN: ${{ secrets.OPENSHIFT_TOKEN }}
        run: |
          if [ -z "$OPENSHIFT_TOKEN" ]; then
            echo "ERROR: OPENSHIFT_TOKEN no está definido o está vacío."
            exit 1
          fi
          echo "::add-mask::$OPENSHIFT_TOKEN"  # asegura que se oculte si se imprime por error
          echo "Longitud del token: ${#OPENSHIFT_TOKEN} caracteres"
          echo -n "$OPENSHIFT_TOKEN" | sha256sum | awk '{print "sha256(token) = "$1}'
      
      - name: Saneando token (quitar CR/LF) y exportando a entorno
        env:
          RAW_TOKEN: ${{ secrets.OPENSHIFT_TOKEN }}
        run: |
          CLEAN_TOKEN="$(printf '%s' "$RAW_TOKEN" | tr -d '\r\n')"
          echo "OPENSHIFT_TOKEN_STRIPPED=$CLEAN_TOKEN" >> $GITHUB_ENV
          echo "::add-mask::$CLEAN_TOKEN"
          echo "Longitud saneada: ${#CLEAN_TOKEN}"

      - name: Inspeccionar JWT (sin exponer token)
        shell: bash
        run: |
          set -euo pipefail
          tok="$OPENSHIFT_TOKEN_STRIPPED"
          if [[ "$tok" != *.*.* ]]; then
            echo "ERROR: El token no tiene formato JWT (header.payload.signature). ¿pegaste un token viejo/base64?"
            exit 1
          fi
          IFS='.' read -r H P S <<< "$tok"
          decode() { python - << 'PY'
      import sys,base64,json,time
      d=sys.stdin.read().strip().replace('-','+').replace('_','/')
      pad='='*((4-len(d)%4)%4)
      try:
        j=json.loads(base64.b64decode(d+pad).decode('utf-8','ignore'))
        print(json.dumps(j, indent=2, ensure_ascii=False))
      except Exception as e:
        print("<<no se pudo decodificar>>")
      PY
      }
          echo "JWT header:";   printf '%s' "$H" | decode
          echo "JWT payload:";  printf '%s' "$P" | decode | tee payload.json
          # Extra: mostrar aud/exp/sub y cuánto falta para expirar
          AUD=$(jq -r '.aud // empty' payload.json || true)
          SUB=$(jq -r '.sub // empty' payload.json || true)
          EXP=$(jq -r '.exp // empty' payload.json || true)
          NOW=$(date +%s)
          if [[ -n "$EXP" ]]; then
            LEFT=$(( EXP - NOW ))
            echo "exp: $EXP (faltan ${LEFT}s)"
            if (( LEFT <= 0 )); then
              echo "ERROR: El token está EXPIRADO."
              exit 1
            fi
          else
            echo "ADVERTENCIA: payload sin 'exp'"
          fi
          echo "aud: ${AUD:-<vacío>}"
          echo "sub: ${SUB:-<vacío>}"

      - name: Probar oc login directo (debug)
        run: |
          oc version
          oc login --token="$OPENSHIFT_TOKEN_STRIPPED" --server="https://api.rm1.0a51.p1.openshiftapps.com:6443"
          oc whoami
          oc whoami --show-user
          
      - name: Log in Openshift
        uses: redhat-actions/oc-login@v1
        with:
          openshift_server_url: https://api.rm1.0a51.p1.openshiftapps.com:6443
          openshift_token: ${{ env.OPENSHIFT_TOKEN_STRIPPED }} 
          namespace: forcet22-dev

      - name: Deploy files
        run: |
          oc project forcet22-dev
          oc apply -f config/security/serviceAccount.yml
          oc rollout status deployment/forcet-deployment

      - name: End
        run: | 
          echo "Si llego aquí es que finalizo, cierto!!"
